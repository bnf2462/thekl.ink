.vg{--vg-ink:#15191f;--vg-mute:#5b6675;--vg-line:#d5dbe3;--vg-card:#fff;--vg-bg:#f5f7fa;
--vg-stage:#4b5563;--vg-block:#2f4a6d;--vg-block-ink:#fff;--vg-mine:#e8262b;--vg-small:#7a8aa0;
font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;color:var(--vg-ink);
background:var(--vg-bg);padding:20px;line-height:1.6}
.vg h1{font-size:22px;margin:0 0 4px}.vg h2{font-size:17px;margin:26px 0 10px;border-left:5px solid var(--vg-ink);padding-left:8px}
.vg h3{font-size:15px;margin:18px 0 8px}.vg .stamp{font-size:12px;color:var(--vg-mute)}
.vg .card{background:var(--vg-card);border:1px solid var(--vg-line);border-radius:10px;padding:14px;margin:10px 0}
.vg table{border-collapse:collapse;width:100%;font-size:13px}.vg th,.vg td{border:1px solid var(--vg-line);padding:6px 8px;text-align:left;vertical-align:top}
.vg th{background:#eef2f7;white-space:nowrap}.vg .t0{color:#0b7a3b;font-weight:700}.vg .t1{color:#1d4ed8;font-weight:700}
.vg .t2{color:#b45309;font-weight:700}.vg .t3{color:#9b1c1c;font-weight:700}
.vg .arena{overflow-x:auto;background:#0d1117;border-radius:10px;padding:12px}
.vg .grid{display:grid;gap:4px;min-width:640px}
.vg .stagebar{background:var(--vg-stage);color:#fff;text-align:center;font-weight:800;border-radius:4px;padding:8px 0}
.vg .blk{background:var(--vg-block);color:var(--vg-block-ink);font-size:11px;font-weight:700;text-align:center;
border-radius:3px;padding:10px 0}
.vg .blk.small{background:var(--vg-small);font-size:9px;padding:4px 0}
.vg .blk.mine{background:var(--vg-mine);outline:3px solid #fff}
.vg .runway{background:var(--vg-stage)}
.vg .cstage{background:var(--vg-stage);color:#fff;font-size:10px;text-align:center;border-radius:3px;padding:3px 0}
.vg .lbl{color:#cbd5e1;font-size:12px;font-weight:800;text-align:center;padding-top:8px}
.vg .note{font-size:12px;color:var(--vg-mute)}
.vg .mapwrap{position:relative;max-width:774px;margin:10px auto;border-radius:8px;overflow:hidden;border:1px solid var(--vg-line)}
.vg .mapwrap img{display:block;width:100%;height:auto}
.vg .mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.vg .plan{position:relative;width:100%;max-width:900px;margin:0 auto}
.vg .plan>div{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.vg .pblk{background:var(--vg-block);color:#fff;border-radius:2px;font-weight:700;font-size:clamp(7px,1.3vw,12px)}
.vg .pblk.small{background:var(--vg-small);font-size:clamp(6px,1vw,9px)}
.vg .pblk.mine{background:var(--vg-mine);outline:3px solid #fff;z-index:2}
.vg .pstage{background:var(--vg-stage);color:#fff;font-weight:800;font-size:clamp(8px,1.4vw,14px)}
.vg .aisle{background:repeating-linear-gradient(90deg,rgba(245,158,11,.28) 0 14px,rgba(245,158,11,.12) 14px 28px);
border-top:2px dashed #f59e0b;border-bottom:2px dashed #f59e0b;color:#fbbf24;font-size:clamp(8px,1.3vw,12px);font-weight:700}
.vg .aisle span{background:rgba(13,17,23,.75);padding:0 6px;border-radius:3px}
.vg .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:6px 0}
.vg .legend i{display:inline-block;width:26px;height:0;border-top:4px solid;vertical-align:middle;margin-right:6px}
.vg td span.mine{border:2px solid #e8262b;border-radius:3px;padding:0 3px;font-weight:700}
.vg .latest{font-size:12px;color:#475569}
.vg h1 .en{display:block;font-size:14px;font-weight:400;color:#475569;margin-top:2px}
.vg sup.fn{font-size:10px;margin-left:2px;white-space:nowrap}.vg sup.fn a{color:#475569;text-decoration:none}
.vg .scroll{overflow-x:auto}.vg ol.refs{font-size:12px;padding-left:26px}.vg ol.refs li{margin:3px 0}
.vg .chk-ok{color:#15803d}.vg .chk-bad{color:#b91c1c}.vg .chk-na{color:#a16207}
.vg td.yn{text-align:center;font-weight:700}
.vg td .en{font-size:12px;color:#475569}
.vg .alias{font-size:12px;color:#475569;margin:0 0 8px}

body{margin:0;background:#0d1117}
.vg.sf{--vg-ink:#e6edf3;--vg-mute:#9da7b3;--vg-line:#30363d;--vg-card:#161b22;--vg-bg:#0d1117;
font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;color:var(--vg-ink);background:var(--vg-bg)}
.sf h1{font-weight:600}
.sf a{color:#79c0ff}
.sf .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:10px 0}
.sf label{display:flex;flex-direction:column;font-size:12px;color:var(--vg-mute)}
.sf input,.sf select{font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--vg-line);border-radius:8px;width:7em;
background:#0d1117;color:var(--vg-ink)}
.sf select{width:auto;min-width:7em}
.sf button{font:inherit;font-size:15px;font-weight:600;padding:8px 14px;border:0;border-radius:8px;background:#e6edf3;color:#0d1117;cursor:pointer}
.sf .res{font-size:16px;font-weight:600;margin:6px 0 0;min-height:1.6em}
.sf .hint{font-size:13px;color:var(--vg-mute);min-height:1.4em;margin-bottom:6px}
.sf .maps{display:grid;gap:12px;align-items:start;grid-template-columns:2fr 1fr;grid-template-areas:"map zoom"}
.sf .maps.off{grid-template-columns:1fr 1fr;grid-template-areas:"map off" "zoom off"}
@media (max-width:760px){.sf .maps,.sf .maps.off{grid-template-columns:1fr;grid-template-areas:"map" "zoom" "off"}}
.sf .f-map{grid-area:map}.sf .f-zoom{grid-area:zoom}.sf .f-off{grid-area:off}
.sf figure{margin:0}.sf figcaption{font-size:12px;color:var(--vg-mute);margin:0 2px 4px}
.sf .key{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.sf svg{width:100%;height:auto;background:var(--vg-card);border:1px solid var(--vg-line);border-radius:10px;display:block}
.sf .notes{font-size:12px;color:var(--vg-mute);margin-top:12px}
.sf .credit{font-size:12px;color:var(--vg-mute);margin:4px 2px 0}

.tmenu{position:relative}
.tmenu summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--line);

.tmenu summary::-webkit-details-marker{display:none}

 const t=(seat-s[2]+0.5)/(s[3]-s[2]+1);return {x:s[4]+t*(s[6]-s[4]),y:s[5]+t*(s[7]-s[5]),s:s}}}return null}
const map=document.getElementById('map'),zoom=document.getElementById('zoom'),off=document.getElementById('off');
const ZW=S.zoom_w||150,ZH=ZW*2/3,PK=S.pin_scale||2.2;
function reset(){base(map);base(zoom);map.setAttribute('viewBox',D.view.join(' '));zoom.setAttribute('viewBox',D.view.join(' '));
 if(off){obase(off);off.setAttribute('viewBox',[0,0,D.official.w,D.official.h].join(' '))}}
function show(){const lv=document.getElementById('lv').value,row=document.getElementById('row').value.trim().toUpperCase(),
 seat=parseInt(document.getElementById('seat').value,10),res=document.getElementById('res'),hint=document.getElementById('hint');
 reset();hint.textContent='';
 if(!(row&&seat>0)){res.textContent=T.bad_input;return}
 const p=locate(lv,row,seat);if(!p){res.textContent=T.not_found;return}
 mark(map,p,PK,true);mark(zoom,p,PK*ZW/600,true);zoom.setAttribute('viewBox',[p.x-ZW/2,p.y-ZH/2,ZW,ZH].join(' '));
 if(off)mark(off,p,PK,false);
 res.textContent=T.found.replace('{level}',(D.levels[lv]||{}).name||lv).replace('{row}',row).replace('{seat}',seat);
 let g=null,best=1e9;for(const q of D.gates){if(String(q[3])!==lv)continue;const d=Math.hypot(q[1]-p.x,q[2]-p.y);if(d<best){best=d;g=q}}
 if(g)hint.textContent=T.gate_hint.replace('{gate}',g[0])}
reset();document.getElementById('go').onclick=show;
for(const id of ['row','seat'])document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')show()});
</script><script>
(function(){var d=document.documentElement,m=document.querySelector('.tmenu'),b=m.querySelectorAll('button');
function set(t){d.setAttribute('data-theme',t);b.forEach(function(x){x.setAttribute('aria-pressed',x.dataset.t===t?'true':'false')});
try{localStorage.setItem('theme',t)}catch(e){}}
var s=null;try{s=localStorage.getItem('theme')}catch(e){}
if(s&&m.querySelector('button[data-t="'+s+'"]'))set(s);
b.forEach(function(x){x.addEventListener('click',function(){set(x.dataset.t);m.open=false})});})();
</script></body></html>
