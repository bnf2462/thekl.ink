.btn.primary,.amzw,.sf .ctl button{background:var(--grad);color:var(--accent-ink)}
.btn.ghost,.copy,.rgshops a{border-color:var(--line);background:none;color:var(--ink)}
.btn.ghost:active,.copy:active,.rgshops a:active{border-color:var(--accent)}
.amzw.na,.rgshops span{border-color:var(--line);border-style:dashed;background:none;color:var(--mute);font-weight:400;cursor:default}
.lang summary,.tocm summary,.tmenu summary,.rgdd summary,.dd,.ddb{position:relative;box-sizing:border-box;align-items:center;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;font-size:13px;font-weight:400;list-style:none;cursor:pointer}
.lang summary::-webkit-details-marker,.tocm summary::-webkit-details-marker,.tmenu summary::-webkit-details-marker,.rgdd summary::-webkit-details-marker{display:none}
.lang summary::before,.tocm summary::before,.tmenu summary::before,.rgdd summary::before,.dd::before,.ddb::before{content:"";position:absolute;left:0;right:0;top:-2px;bottom:-2px}
.lang summary:active,.tocm summary:active,.tmenu summary:active,.rgdd summary:active{opacity:.72}
.lang ul,.tocm ul,.tmenu ul,.rgdd ul,.ddm,.lay .pop{margin:0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.lang li a,.tmenu ul button,.rgdd ul button,.ddm li,.prow{display:flex;align-items:center;width:100%;min-height:40px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--ink);font-family:inherit;font-size:13px;font-weight:400;text-align:left;text-decoration:none;cursor:pointer}
.lang li a:hover,.lang li a:focus,.tmenu ul button:hover,.rgdd ul button:hover,.ddm li:hover,.ddm li:focus,.prow:hover{background:var(--bg)}
.lang li a[aria-current],.tmenu ul button[aria-pressed="true"],.rgdd ul button[aria-pressed="true"],.ddm li[aria-selected="true"]{background:var(--bg);color:var(--accent)}
.lang li+li,.tmenu li+li,.rgdd ul li+li,.ddm li+li,.prow+.prow{margin-top:4px}
.lang summary::after,.tocm summary::after,.tmenu summary::after,.rgdd summary::after,.dd i,.ddb::after,.mo::after{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-2px) rotate(45deg)}
.lang[open] summary::after,.tocm[open] summary::after,.tmenu[open] summary::after,.rgdd[open] summary::after,.dd[aria-expanded="true"] i,.ddb[aria-expanded="true"]::after,.mo[aria-expanded="true"]::after{transform:translateY(2px) rotate(225deg)}
.lang summary:active::after,.tocm summary:active::after,.tmenu summary:active::after,.rgdd summary:active::after,.dd:active i,.ddb:active::after,.mo:active::after{border-color:var(--accent)}
.opt .pl{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:13px;font-weight:400;white-space:nowrap}
.opt[aria-pressed="true"] .pl,.bar .on .pl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ytabs .mo,.vw .mo{color:var(--accent2);background:none;border-color:transparent;cursor:pointer}
.ytabs .mo.on{color:var(--accent);background:none;border-color:transparent}
.mo .ml{display:inline-grid}
.mo .ml>span{grid-area:1/1}
.mo[aria-expanded="false"] .ml>span+span,.mo[aria-expanded="true"] .ml>span:first-child{visibility:hidden}
.tile,.grid .card,.ml a,.vl a,.lkb a,.pgs button{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
@media (hover:hover){.tile:hover,.grid .card:hover,.ml a:hover,.vl a:hover,.lkb a:hover,.pgs button:hover{border-color:var(--hover)}}
.tile[aria-pressed="true"],.pgs button[aria-pressed="true"]{border-color:var(--accent)}
