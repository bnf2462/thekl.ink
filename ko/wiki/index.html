<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex"><title>Know artists | THE K′ LINKs</title><script>(function(){try{var s=localStorage.getItem('theme');if(["bp", "lemonade", "newjeans", "babymonster"].indexOf(s)>=0)document.documentElement.setAttribute('data-theme',s)}catch(e){}})();</script><style>:root{--bg:#000000;--card:#141414;--line:#2e2e2e;--ink:#b9cbcd;--mute:#b3b3b3;--accent:#f4a7b9;--accent2:#e4577f;--accent-ink:#000000;--hover:#f4a7b9;--grad:linear-gradient(135deg,#f4a7b9,#e4577f);--hdr:rgba(0,0,0,.9)}:root[data-theme="bp"]{--bg:#000000;--card:#141414;--line:#2e2e2e;--ink:#b9cbcd;--mute:#b3b3b3;--accent:#f4a7b9;--accent2:#e4577f;--accent-ink:#000000;--hover:#f4a7b9;--grad:linear-gradient(135deg,#f4a7b9,#e4577f);--hdr:rgba(0,0,0,.9)}:root[data-theme="lemonade"]{--bg:#000000;--card:#141414;--line:#2e2e2e;--ink:#b9cbcd;--mute:#b3b3b3;--accent:#e3f11b;--accent2:#b6e307;--accent-ink:#000000;--hover:#e3f11b;--grad:linear-gradient(135deg,#e3f11b,#b6e307);--hdr:rgba(0,0,0,.9)}:root[data-theme="newjeans"]{--bg:#000000;--card:#141414;--line:#2e2e2e;--ink:#b9cbcd;--mute:#b3b3b3;--accent:#67c699;--accent2:#ab487b;--accent-ink:#000000;--hover:#67c699;--grad:linear-gradient(135deg,#67c699,#649283);--hdr:rgba(0,0,0,.9)}:root[data-theme="babymonster"]{--bg:#000000;--card:#141414;--line:#2e2e2e;--ink:#b9cbcd;--mute:#b3b3b3;--accent:#c05050;--accent2:#c05050;--accent-ink:#ffffff;--hover:#c05050;--grad:linear-gradient(135deg,#c05050,#a40101);--hdr:rgba(0,0,0,.9)}
.tmenu{position:relative}
.tmenu summary{display:flex;gap:8px}
.tmenu summary i,.tmenu button i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--grad)}
.tmenu ul{position:absolute;right:0;top:calc(100% + 4px);z-index:10;min-width:200px}
.tmenu ul button{gap:12px}
.tmenu button span{display:flex;flex-direction:column;line-height:1.3}
.tmenu button small{font-size:11px;font-weight:400;color:var(--mute)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif}a{color:inherit}html{-webkit-tap-highlight-color:transparent}
button:active,a:active{opacity:.72}
details.blk>summary:active .cv{background:var(--accent)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 16px;
background:var(--hdr);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header{font-size:16px}.brand{color:var(--ink);font-weight:700;letter-spacing:.04em;text-decoration:none}footer{max-width:1120px;margin:0 auto;padding:28px 16px 32px;color:var(--mute);font-size:12px}
.vw{max-width:1120px;margin:0 auto;padding:20px 16px 8px}
.vw h1{margin:4px 0 2px;font:700 30px/1.2 "Rubik","Noto Sans JP",sans-serif;letter-spacing:.01em}.vw h1 .n{background-image:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.vw .sub{margin:0 0 14px;color:var(--mute);font-size:14px}
.wgt{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));grid-auto-rows:1fr;gap:8px;margin:0 0 14px}
.tile{position:relative;min-height:64px;display:grid;grid-template-columns:36px 1fr;align-items:center;column-gap:8px;
padding:10px 10px 10px 8px;font:inherit;text-align:left}
.tile .gi{width:36px;height:36px;border-radius:9px;overflow:hidden;display:grid;place-items:center;background:var(--grad);color:#000;font:700 10px "Rubik",sans-serif}
.tile .gi img{width:100%;height:100%;object-fit:cover;display:block}.tile .tx{min-width:0}
.tile .gen{position:absolute;right:12px;bottom:9px;padding:0 7px;border:1px solid var(--line);border-radius:8px;font-size:11px;line-height:16px;color:var(--ink)}
.tile b{display:block;font-size:14px;line-height:1.25}.tile i{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.ml{display:grid;gap:8px;max-width:560px;list-style:none;margin:0;padding:0}
.ml a,.ml .na{display:grid;grid-template-columns:1fr 56px;align-items:center;column-gap:12px;padding:8px 8px 8px 14px}
.ml .nm{display:block;font-size:15px;font-weight:700}.ml .gn{display:block;margin-top:3px;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.06em}
.ml .fc{width:56px;height:56px;border-radius:12px;object-fit:cover;display:grid;place-items:center;background:#2a2a2a;color:var(--mute);font-size:11px}
.ml .na{opacity:.45}
@media (min-width:760px){.ml{grid-template-columns:1fr 1fr;max-width:none}}
.wix{position:relative}.wix>.bkb{position:absolute;right:16px;top:24px}
.bkb{display:inline-flex;gap:4px;text-decoration:none}.bkb i{flex:none;width:16px;height:16px;margin-left:-4px;background:currentColor;-webkit-mask:var(--i-left) center/contain no-repeat;mask:var(--i-left) center/contain no-repeat}</style><link rel="alternate" hreflang="ko" href="https://thekl.ink/ko/wiki/"><link rel="alternate" hreflang="ja" href="https://thekl.ink/wiki/"><link rel="alternate" hreflang="zh-Hans" href="https://thekl.ink/cn/wiki/"><link rel="alternate" hreflang="zh-Hant" href="https://thekl.ink/tw/wiki/"><link rel="alternate" hreflang="en" href="https://thekl.ink/en/wiki/"><link rel="alternate" hreflang="x-default" href="https://thekl.ink/en/wiki/"><style>.lang{position:relative}
.lang summary{display:flex;gap:10px}
.lang ul{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:10;overflow:hidden}
.lang li a{gap:10px;white-space:nowrap}
.lang .lfl{font-family:"Lang Flags",sans-serif;font-size:16px;line-height:1;font-weight:400}
.lang.float{position:fixed;right:calc(24px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:20}

.btn.ghost,.copy,.rgshops a{border-color:var(--line);background:none;color:var(--ink)}

.lang ul,.tocm ul,.tmenu ul,.rgdd ul,.ddm,.lay .pop{margin:0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}

.lang li a:hover,.lang li a:focus,.tocm li a:hover,.tocm li a:focus,.tocm li.tr:hover>a,.tmenu ul button:hover,.rgdd ul button:hover,.ddm li:hover,.ddm li:focus,.prow:hover{background:var(--bg)}
.lang li a[aria-current],.tocm li.tr.cur>a,.tmenu ul button[aria-pressed="true"],.rgdd ul button[aria-pressed="true"],.ddm li[aria-selected="true"]{background:var(--bg);color:var(--accent)}
.lang li+li,.tocm li+li,.tmenu li+li,.rgdd ul li+li,.ddm li+li,.prow+.prow{margin-top:4px}
.lang summary::after,.tocm summary::after,.tmenu summary::after,.rgdd summary::after,.dd i,.ddb::after{content:"";flex:none;width:16px;height:16px;background:var(--mute);-webkit-mask:var(--i-down) center/contain no-repeat;mask:var(--i-down) center/contain no-repeat}
.lang[open] summary::after,.tocm[open] summary::after,.tmenu[open] summary::after,.rgdd[open] summary::after,.dd[aria-expanded="true"] i,.ddb[aria-expanded="true"]::after{transform:rotate(180deg)}
.lang summary:active::after,.tocm summary:active::after,.tmenu summary:active::after,.rgdd summary:active::after,.dd:active i,.ddb:active::after{background:var(--accent)}
.opt .pl{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:13px;font-weight:400;white-space:nowrap}
.opt[aria-pressed="true"] .pl,.bar .on .pl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ytabs .mo,.vw .mo{color:var(--accent2);background:none;border-color:transparent;cursor:pointer}
.ytabs .mo.on{color:var(--accent);background:none;border-color:transparent}
.mo .ml{display:inline-grid}
.mo .ml>span{grid-area:1/1}
.mo[aria-expanded="false"] .ml>span+span,.mo[aria-expanded="true"] .ml>span:first-child{visibility:hidden}
.mo .pm{flex:none;width:16px;height:16px;transition:transform .2s ease}
.mo .pm .pv{transform-box:fill-box;transform-origin:center;transition:transform .2s ease}
.mo[aria-expanded="true"] .pm{transform:rotate(180deg)}
.mo[aria-expanded="true"] .pm .pv{transform:rotate(90deg)}
.tile,.grid .card,.ml a,.vl a,.lkb a,.pgs button{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
@media (hover:hover){.tile:hover,.grid .card:hover,.ml a:hover,.vl a:hover,.lkb a:hover,.pgs button:hover{border-color:var(--hover)}}
.tile[aria-pressed="true"],.pgs button[aria-pressed="true"]{border-color:var(--accent)}
.ml .na,.share{border:1px solid var(--line);border-radius:14px;background:var(--card)}
.more,.sf a{color:var(--accent);text-decoration:underline}
.vt a{color:var(--accent);text-decoration:none}
footer a{color:var(--mute);text-decoration:underline}
.lk2 a{text-decoration:none}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.mo .pm,.mo .pm .pv{transition:none}}
