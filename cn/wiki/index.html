<!DOCTYPE html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex"><title>Know artists | THE K′ LINKs</title><script>(function(){try{var s=localStorage.getItem('theme');if(["bp", "lemonade", "newjeans", "babymonster"].indexOf(s)>=0)document.documentElement.setAttribute('data-theme',s)}catch(e){}})();</script><style>:root{--bg:#000000;--card:#141414;--line:#2e2e2e;--ink:#b9cbcd;--mute:#b3b3b3;--accent:#f4a7b9;--accent2:#e4577f;--accent-ink:#000000;--hover:#f4a7b9;--grad:linear-gradient(135deg,#f4a7b9,#e4577f);--hdr:rgba(0,0,0,.9)}:root[data-theme="bp"]{--bg:#000000;--card:#141414;--line:#2e2e2e;--ink:#b9cbcd;--mute:#b3b3b3;--accent:#f4a7b9;--accent2:#e4577f;--accent-ink:#000000;--hover:#f4a7b9;--grad:linear-gradient(135deg,#f4a7b9,#e4577f);--hdr:rgba(0,0,0,.9)}:root[data-theme="lemonade"]{--bg:#000000;--card:#141414;--line:#2e2e2e;--ink:#b9cbcd;--mute:#b3b3b3;--accent:#e3f11b;--accent2:#b6e307;--accent-ink:#000000;--hover:#e3f11b;--grad:linear-gradient(135deg,#e3f11b,#b6e307);--hdr:rgba(0,0,0,.9)}:root[data-theme="newjeans"]{--bg:#000000;--card:#141414;--line:#2e2e2e;--ink:#b9cbcd;--mute:#b3b3b3;--accent:#67c699;--accent2:#ab487b;--accent-ink:#000000;--hover:#67c699;--grad:linear-gradient(135deg,#67c699,#649283);--hdr:rgba(0,0,0,.9)}:root[data-theme="babymonster"]{--bg:#000000;--card:#141414;--line:#2e2e2e;--ink:#b9cbcd;--mute:#b3b3b3;--accent:#c05050;--accent2:#c05050;--accent-ink:#ffffff;--hover:#c05050;--grad:linear-gradient(135deg,#c05050,#a40101);--hdr:rgba(0,0,0,.9)}
.tmenu{position:relative}
.tmenu summary{list-style:none;position:relative;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);
border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.tmenu summary::before{content:"";position:absolute;left:0;right:0;top:-2px;bottom:-2px}
.tmenu summary::-webkit-details-marker{display:none}
.tmenu summary i,.tmenu button i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--grad)}
.tmenu summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-2px) rotate(45deg)}
.tmenu[open] summary::after{transform:translateY(2px) rotate(225deg)}.tmenu summary:active::after{border-color:var(--accent)}
.tmenu ul{position:absolute;right:0;top:calc(100% + 8px);z-index:10;min-width:200px;margin:0;padding:6px;list-style:none;
background:var(--card);border:1px solid var(--line);border-radius:12px}
.tmenu button{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:0 12px;border:0;border-radius:8px;
background:none;color:var(--ink);font:inherit;font-size:13px;font-weight:700;text-align:left;cursor:pointer}
.tmenu button:hover{background:var(--bg)}
.tmenu button[aria-pressed="true"]{color:var(--accent);background:var(--bg)}
.tmenu button span{display:flex;flex-direction:column;line-height:1.3}
.tmenu button small{font-size:11px;font-weight:400;color:var(--mute)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif}a{color:inherit}html{-webkit-tap-highlight-color:transparent}
button:active,a:active,.lang summary:active,.tmenu summary:active{opacity:.72}
details.blk>summary:active .cv{border-color:var(--accent)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 16px;
background:var(--hdr);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header{font-size:16px}.brand{color:var(--ink);font-weight:700;letter-spacing:.04em;text-decoration:none}footer{max-width:1120px;margin:0 auto;padding:28px 16px 32px;color:var(--mute);font-size:12px}
.vw{max-width:1120px;margin:0 auto;padding:20px 16px 8px}
.vw h1{font-size:30px;line-height:1.2;margin:4px 0 2px;letter-spacing:.02em}.vw h1 .v{color:var(--accent)}
.vw .sub{margin:0 0 14px;color:var(--mute);font-size:14px}
.wgt{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));grid-auto-rows:1fr;gap:8px;margin:0 0 14px}
.tile{position:relative;min-height:64px;display:grid;grid-template-columns:36px 1fr;align-items:center;column-gap:8px;
padding:10px 10px 10px 8px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.tile .gi{width:36px;height:36px;border-radius:9px;overflow:hidden;display:grid;place-items:center;background:var(--grad);color:#000;font:700 10px "Rubik",sans-serif}
.tile .gi img{width:100%;height:100%;object-fit:cover;display:block}.tile .tx{min-width:0}
.tile .gen{position:absolute;right:12px;bottom:9px;padding:0 7px;border:1px solid var(--line);border-radius:8px;font-size:11px;line-height:16px;color:var(--ink)}
.tile b{display:block;font-size:14px;line-height:1.25}.tile i{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.tile[aria-pressed="true"]{border-color:var(--accent)}
.ml{display:grid;gap:8px;max-width:560px;list-style:none;margin:0;padding:0}
.ml a,.ml .na{display:grid;grid-template-columns:1fr 56px;align-items:center;column-gap:12px;padding:8px 8px 8px 14px;border:1px solid var(--line);
border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none}
.ml .nm{display:block;font-size:15px;font-weight:700}.ml .gn{display:block;margin-top:3px;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.06em}
.ml .fc{width:56px;height:56px;border-radius:12px;object-fit:cover;display:grid;place-items:center;background:#2a2a2a;color:var(--mute);font-size:11px}
.ml .na{opacity:.45}
